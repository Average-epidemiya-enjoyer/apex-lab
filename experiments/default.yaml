experiment_name: default
track: oval

algorithms:
  - name: a_star
    params:
      resolution: 0.5
      heuristic: euclidean
  - name: rrt_star
    params:
      max_iter: 5000
      step_size: 1.0
      search_radius: 5.0

episodes: 5
seed: 42
render: false
output_dir: runs/default

simulator:
  dt: 0.05
  max_steps: 10000

metrics:
  - lap_time
  - path_length
  - smoothness
