[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-lab"
version = "0.1.0"
description = "Research framework for benchmarking path-planning algorithms on racing circuits"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "pygame>=2.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "gymnasium>=0.29",
    "stable-baselines3>=2.2",
    "torch>=2.2",
    "pandas>=2.2",
    "shapely>=2.0",
    "scikit-image>=0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.scripts]
apex-lab = "apex_lab.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["apex_lab*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=apex_lab --cov-report=term-missing"
